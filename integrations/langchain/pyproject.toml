[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "langchain-financial-evidence"
version = "0.1.0"
description = "Read-only LangChain tools for source-cited public financial evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Liquidity Lab"}]
keywords = ["langchain", "financial-data", "money-markets", "liquidity", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
]
dependencies = ["langchain-core>=1.6.6,<2", "pydantic>=2.7.4,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "langchain-tests==1.1.9"]

[project.urls]
Homepage = "https://liquilens.in/agents/"
Documentation = "https://github.com/beepboop2025/langchain-financial-evidence#readme"
Source = "https://github.com/beepboop2025/langchain-financial-evidence"
Issues = "https://github.com/beepboop2025/langchain-financial-evidence/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_financial_evidence"]

[tool.pytest.ini_options]
testpaths = ["tests/unit_tests"]
asyncio_mode = "auto"
