name: Native office acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/office/**'
      - 'scripts/office_native/**'
      - 'scripts/create_office_fixtures.cjs'
      - 'tests/office-fixtures.cjs'
      - '.github/workflows/office-native.yml'

permissions:
  contents: read

concurrency:
  group: office-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  office-native:
    name: Native ${{ matrix.engine }} acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [onlyoffice, nextcloud-collabora]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned acceptance readers and isolated browser
        run: |
          python -m pip install requests==2.32.5 openpyxl==3.1.5 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify corruption detection
        run: python scripts/office_native/test_verify_cells.py
      - name: Run native import and browser acceptance
        run: python scripts/office_native/accept.py '${{ matrix.engine }}' 'office-native-${{ matrix.engine }}'
      - name: Retain receipts, converted workbooks, and editor screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: office-native-${{ matrix.engine }}
          path: office-native-${{ matrix.engine }}/
          retention-days: 14
          if-no-files-found: error
