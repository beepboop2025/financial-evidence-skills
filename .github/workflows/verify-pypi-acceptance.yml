name: Published 0.1.13 independent consumers

on:
  push:
    branches: [verify/pypi-acceptance-20261018]

permissions:
  contents: read

jobs:
  published-mcp-consumer:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the immutable public release
        run: docker pull --platform '${{ matrix.platform }}' ghcr.io/beepboop2025/financial-evidence-skills@sha256:fe6f3ab3509edc29c805aefc5985df754d9f0411346f52ea8c8adb1c0e9b454c
      - name: Exercise the published stdio contract without network access
        env:
          TESTED_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/verify_published_mcp.py --contract integrations/financial-evidence-mcp-v0.1.13.json --receipt published-mcp-receipt.json -- \
            docker run --rm --interactive --platform "$TESTED_PLATFORM" --pull never --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 \
            --memory 128m --cpus 1 \
            ghcr.io/beepboop2025/financial-evidence-skills@sha256:fe6f3ab3509edc29c805aefc5985df754d9f0411346f52ea8c8adb1c0e9b454c
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          image = "ghcr.io/beepboop2025/financial-evidence-skills@sha256:fe6f3ab3509edc29c805aefc5985df754d9f0411346f52ea8c8adb1c0e9b454c"
          details = json.loads(subprocess.check_output(["docker", "image", "inspect", image]))[0]
          platform = details["Os"] + "/" + details["Architecture"]
          assert platform == os.environ["TESTED_PLATFORM"]
          assert details["Config"]["Labels"]["org.opencontainers.image.revision"] == "e93613059bd65c1534ca0d65c0390dba348e165f"
          assert details["Config"]["Labels"]["org.opencontainers.image.version"] == "0.1.13"
          assert details["Config"]["User"] == "65532:65532"
          path = pathlib.Path("published-mcp-receipt.json")
          receipt = json.loads(path.read_text())
          receipt.update(tested_platform=platform, image=image, image_id=details["Id"],
                         source_commit=details["Config"]["Labels"]["org.opencontainers.image.revision"])
          runtime = json.loads(subprocess.check_output([
              "docker", "run", "--rm", "--platform", os.environ["TESTED_PLATFORM"],
              "--pull", "never", "--read-only", "--network", "none",
              "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
              "--pids-limit", "64", "--memory", "128m", "--cpus", "1",
              "--entrypoint", "financial-evidence-runtime", image, "catalog",
          ]))
          assert runtime["schema"] == "financial-evidence.runtime-capabilities.v1"
          receipt["runtime_catalog"] = "PASS"
          workflow = json.loads(subprocess.check_output([
              "docker", "run", "--rm", "--platform", os.environ["TESTED_PLATFORM"],
              "--pull", "never", "--read-only", "--network", "none",
              "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
              "--pids-limit", "64", "--memory", "128m", "--cpus", "1",
              "--tmpfs", "/state:rw,noexec,nosuid,size=2m,mode=0700,uid=65532,gid=65532",
              "--entrypoint", "financial-evidence", image,
              "workflow", "report", "--state", "/state/journal",
          ]))
          assert workflow["schema"] == "financial-evidence.workflow-report.v1"
          assert workflow["runs"] == 0
          assert workflow["operator_confirmed_useful_workflows"] == 0
          assert workflow["independently_verified_outcomes"] is None
          receipt["recurring_workflow_report"] = "PASS"
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Retain the published artifact receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: published-mcp-consumer-${{ matrix.architecture }}
          path: published-mcp-receipt.json
          retention-days: 30

