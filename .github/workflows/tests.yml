name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homebrew-candidate-consumer:
    name: Independent Homebrew candidate acceptance
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      TAP_SOURCE: "484a5c85af3b3e1a54442a89bef21ad6c5a330ee"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: beepboop2025/homebrew-tap
          ref: 484a5c85af3b3e1a54442a89bef21ad6c5a330ee
          path: tap-candidate
          persist-credentials: false
      - name: Register only the exact public candidate tap
        run: |
          test "$(git -C tap-candidate rev-parse HEAD)" = "$TAP_SOURCE"
          brew tap beepboop2025/tap "$GITHUB_WORKSPACE/tap-candidate"
          test "$(git -C "$(brew --repo beepboop2025/tap)" rev-parse HEAD)" = "$TAP_SOURCE"
      - name: Trust only the verified candidate formula
        run: brew trust --formula beepboop2025/tap/financial-evidence
      - run: brew audit --strict --online beepboop2025/tap/financial-evidence
      - run: brew style beepboop2025/tap/financial-evidence
      - run: brew install beepboop2025/tap/financial-evidence
      - run: brew test beepboop2025/tap/financial-evidence
      - name: Verify installed MCP and retain the separate candidate identity
        run: |
          python3 scripts/verify_published_mcp.py --contract integrations/financial-evidence-mcp-v0.1.17.json --receipt homebrew-mcp-receipt.json -- \
            "$(brew --prefix financial-evidence)/bin/financial-evidence-mcp"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          from datetime import datetime, timezone
          tap = subprocess.check_output(["brew", "--repo", "beepboop2025/tap"], text=True).strip()
          source = subprocess.check_output(["git", "-C", tap, "rev-parse", "HEAD"], text=True).strip()
          assert source == os.environ["TAP_SOURCE"]
          formula = pathlib.Path(tap) / "Formula/financial-evidence.rb"
          assert hashlib.sha256(formula.read_bytes()).hexdigest() == "b8ba572acbd1c866a615412263bcb57f76eac76750a07422836cc2545e688f13"
          formula_text = formula.read_text()
          release_url = re.search(r'^  url "([^"]+)"', formula_text, re.M).group(1)
          release_sha256 = re.search(r'^  sha256 "([^"]+)"', formula_text, re.M).group(1)
          assert release_url == "https://github.com/beepboop2025/financial-evidence-skills/releases/download/v0.1.17/financial_evidence-0.1.17.tar.gz"
          assert release_sha256 == "1ba59c858adbc39e1b49c5fb09b33eddea1dd7e97a3698e8db06bf77d886238e"
          prefix = subprocess.check_output(["brew", "--prefix", "financial-evidence"], text=True).strip()
          python = pathlib.Path(prefix) / "libexec/bin/python"
          installed = json.loads(subprocess.check_output([str(python), "-c", '''
          import hashlib, json
          from importlib.metadata import distribution
          from pathlib import Path
          import financial_evidence.hosted
          import financial_evidence.agent_workflow
          import financial_evidence.research
          import financial_evidence.trading.context
          import financial_evidence.trading.client
          import financial_evidence.trading.product_mcp
          package = distribution("financial-evidence")
          entries = {entry.name: entry for entry in package.entry_points if entry.group == "console_scripts"}
          expected = {"financial-evidence", "financial-evidence-mcp", "financial-evidence-api",
              "financial-evidence-workspace-mcp", "financial-evidence-agent-mcp", "financial-evidence-runtime",
              "financial-evidence-runtime-mcp", "financial-evidence-learning", "financial-evidence-trading",
              "seiche-network-client-mcp", "financial-evidence-product-mcp"}
          assert set(entries) == expected
          assert all(callable(entry.load()) for entry in entries.values())
          print(json.dumps({"version": package.version, "entrypoints": sorted(entries),
              "all_entrypoints_load": True, "platform_url": financial_evidence.hosted.PLATFORM_URL,
              "hosted_module_sha256": hashlib.sha256(Path(financial_evidence.hosted.__file__).read_bytes()).hexdigest(),
              "workflow_module_sha256": hashlib.sha256(Path(financial_evidence.agent_workflow.__file__).read_bytes()).hexdigest(),
              "research_module_sha256": hashlib.sha256(Path(financial_evidence.research.__file__).read_bytes()).hexdigest(),
              "geography_client_module_sha256": hashlib.sha256(Path(financial_evidence.trading.client.__file__).read_bytes()).hexdigest(),
              "geography_bridge_module_sha256": hashlib.sha256(Path(financial_evidence.trading.product_mcp.__file__).read_bytes()).hexdigest(),
              "context_module_sha256": hashlib.sha256(Path(financial_evidence.trading.context.__file__).read_bytes()).hexdigest()}))
          '''], text=True))
          assert installed["version"] == "0.1.17"
          assert installed["platform_url"] == "https://agents.seiche.info"
          assert installed["hosted_module_sha256"] == "108b87f1c8129084bbb394ffcf0932636f58f6c1942918e7103796be8dd98fa7"
          assert installed["context_module_sha256"] == "6a62b6c2a1b8fa1a15bd775a607b4b3cac7d558f092545cb401b1c211d656aec"
          assert installed["research_module_sha256"] == "4d3970956b792fac5470b119d18ebccb9d3e2fea10abd2b41a3f4a4518449ffe"
          assert installed["workflow_module_sha256"] == "b0783cd03512be7a12387c4dbd0aa8fbaed213511a95e1fa5269aad672168c00"
          assert installed["geography_client_module_sha256"] == "afcc79c4d36fb31075a25b98457a07692dc94b6a1997daa619923171f6ca1566"
          assert installed["geography_bridge_module_sha256"] == "35a2ae350407e00fa87a7b28403a73d78d57f948bafd25a3149f5d9095b2581c"
          receipt = {"schema": "financial-evidence.homebrew-candidate-acceptance.v1",
                     "observed_at": datetime.now(timezone.utc).isoformat(),
                     "source_commit": source, "formula_sha256": hashlib.sha256(formula.read_bytes()).hexdigest(),
                     "release_source_commit": "a5b2a2fbe77382a155a9b35f6b65c7996c4128e9",
                     "release_url": release_url, "release_sha256": release_sha256, "installed": installed,
                     "checks": ["strict_online_audit", "style", "actual_install", "formula_test", "published_mcp_contract",
                                "all_11_entrypoints_load", "installed_central_client_identity", "installed_context_patch_identity",
                                "installed_first_review_commands", "installed_research_module_identity",
                                "installed_recurring_workflow_commands", "installed_workflow_module_identity",
                                "installed_geography_client_bounds_and_evidence", "installed_geography_client_identity",
                                "installed_geography_bridge_identity"],
                     "status": "PASS", "scope": "Independent consumer acceptance, not native tap CI or public tap publication"}
          pathlib.Path("homebrew-source-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: homebrew-candidate-consumer
          path: |
            homebrew-mcp-receipt.json
            homebrew-source-receipt.json
          retention-days: 30

  published-mcp-consumer:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the immutable public release
        run: docker pull --platform '${{ matrix.platform }}' ghcr.io/beepboop2025/financial-evidence-skills@sha256:cda4c71c9d1c4723a4fe2e9f21b15c7d9fea272385c66ba90a7a5968958c7ab0
      - name: Exercise the published stdio contract without network access
        env:
          TESTED_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/verify_published_mcp.py --contract integrations/financial-evidence-mcp-v0.1.17.json --receipt published-mcp-receipt.json -- \
            docker run --rm --interactive --platform "$TESTED_PLATFORM" --pull never --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 \
            --memory 128m --cpus 1 \
            ghcr.io/beepboop2025/financial-evidence-skills@sha256:cda4c71c9d1c4723a4fe2e9f21b15c7d9fea272385c66ba90a7a5968958c7ab0
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          image = "ghcr.io/beepboop2025/financial-evidence-skills@sha256:cda4c71c9d1c4723a4fe2e9f21b15c7d9fea272385c66ba90a7a5968958c7ab0"
          details = json.loads(subprocess.check_output(["docker", "image", "inspect", image]))[0]
          platform = details["Os"] + "/" + details["Architecture"]
          assert platform == os.environ["TESTED_PLATFORM"]
          assert details["Config"]["Labels"]["org.opencontainers.image.revision"] == "a5b2a2fbe77382a155a9b35f6b65c7996c4128e9"
          assert details["Config"]["Labels"]["org.opencontainers.image.version"] == "0.1.17"
          assert details["Config"]["User"] == "65532:65532"
          path = pathlib.Path("published-mcp-receipt.json")
          receipt = json.loads(path.read_text())
          receipt.update(tested_platform=platform, image=image, image_id=details["Id"],
                         source_commit=details["Config"]["Labels"]["org.opencontainers.image.revision"])
          runtime = json.loads(subprocess.check_output([
              "docker", "run", "--rm", "--platform", os.environ["TESTED_PLATFORM"],
              "--pull", "never", "--read-only", "--network", "none",
              "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
              "--pids-limit", "64", "--memory", "128m", "--cpus", "1",
              "--entrypoint", "financial-evidence-runtime", image, "catalog",
          ]))
          assert runtime["schema"] == "financial-evidence.runtime-capabilities.v1"
          receipt["runtime_catalog"] = "PASS"
          workflow = json.loads(subprocess.check_output([
              "docker", "run", "--rm", "--platform", os.environ["TESTED_PLATFORM"],
              "--pull", "never", "--read-only", "--network", "none",
              "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
              "--pids-limit", "64", "--memory", "128m", "--cpus", "1",
              "--tmpfs", "/state:rw,noexec,nosuid,size=2m,mode=0700,uid=65532,gid=65532",
              "--entrypoint", "financial-evidence", image,
              "workflow", "report", "--state", "/state/journal",
          ]))
          assert workflow["schema"] == "financial-evidence.workflow-report.v1"
          assert workflow["runs"] == 0
          assert workflow["operator_confirmed_useful_workflows"] == 0
          assert workflow["independently_verified_outcomes"] is None
          receipt["recurring_workflow_report"] = "PASS"
          connections = json.loads(subprocess.check_output([
              "docker", "run", "--rm", "--platform", os.environ["TESTED_PLATFORM"],
              "--pull", "never", "--read-only", "--network", "none",
              "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
              "--pids-limit", "64", "--memory", "128m", "--cpus", "1",
              "--entrypoint", "financial-evidence", image, "connect", "--catalog",
          ]))
          assert connections["schema"] == "financial-evidence.connection-catalog.v1"
          assert connections["network_access_performed"] is False
          assert len(connections["products"]) == 14
          assert connections["clients"] == ["mcp", "vscode"]
          receipt["offline_connection_catalog"] = "PASS"
          geography_code = '''
          import asyncio, json
          from copy import deepcopy
          import financial_evidence
          from financial_evidence.trading import ProductClient
          from financial_evidence.trading.client import READ_TOOLS
          async def check():
              assert financial_evidence.__version__ == "0.1.17"
              assert "lending_geography" in READ_TOOLS["liquilens"]
              calls = []
              evidence = {"schema": "liquilens.lending-geography.v1", "scope": "research",
                  "as_of": "2026-11-05", "score_authority": False, "scoring_eligible": False,
                  "offset": 5, "next_offset": 10,
                  "sources": {"soil_moisture": {"as_of": "2024-10-15"}},
                  "districts": [{"recent_months": {"mm": [0, None, 10]}}]}
              result = {"content": [{"type": "text", "text": json.dumps(evidence)}]}
              async def transport(url, tool, arguments, timeout):
                  calls.append((url, tool, deepcopy(arguments)))
                  return {"result": deepcopy(result)}
              client = ProductClient(transport=transport, mode="test", platform_url="https://agents.seiche.info")
              arguments = {"id": "in-state-rajasthan", "offset": 5}
              observed = await client.call("liquilens", "lending_geography", arguments)
              assert observed["payload"]["result"] == result
              assert json.loads(observed["payload"]["result"]["content"][0]["text"]) == evidence
              assert calls == [("https://agents.seiche.info/products/liquilens/mcp", "lending_geography", arguments)]
              invalid = [{"id": "https://example.invalid"}, {"id": "in-state-rajasthan", "score_authority": True},
                  *({"id": "in-state-rajasthan", "offset": value} for value in (True, -1, 1001, 0.5))]
              for arguments in invalid:
                  try:
                      await client.call("liquilens", "lending_geography", arguments)
                  except ValueError:
                      pass
                  else:
                      raise AssertionError("invalid geography arguments were accepted")
              assert len(calls) == 1
              print(json.dumps({"status": "PASS", "synthetic": True, "mock_transport_calls": len(calls),
                  "invalid_arguments_rejected": len(invalid), "source_dates_and_missingness_preserved": True,
                  "configured_central_endpoint_only": True, "live_geography_requests": 0,
                  "native_mcp_bridge_qualified": False}))
          asyncio.run(check())
          '''
          geography = json.loads(subprocess.check_output([
              "docker", "run", "--rm", "--platform", os.environ["TESTED_PLATFORM"],
              "--pull", "never", "--read-only", "--network", "none",
              "--cap-drop", "ALL", "--security-opt", "no-new-privileges",
              "--pids-limit", "64", "--memory", "128m", "--cpus", "1",
              "--entrypoint", "python", image, "-I", "-B", "-c", geography_code,
          ]))
          assert geography["status"] == "PASS"
          assert geography["live_geography_requests"] == 0
          assert geography["native_mcp_bridge_qualified"] is False
          receipt["offline_geography_client"] = geography
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Retain the published artifact receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: published-mcp-consumer-${{ matrix.architecture }}
          path: published-mcp-receipt.json
          retention-days: 30

  native-agent-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: langchain
            sdk: langchain-core==1.6.6
          - framework: crewai
            sdk: crewai==1.6.1
          - framework: openai
            sdk: openai-agents==0.22.3
          - framework: pydantic-ai
            sdk: pydantic-ai-slim==2.52.0
    env:
      FINANCIAL_EVIDENCE_REQUIRED_FRAMEWORK: ${{ matrix.framework }}
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_DISABLED: 'true'
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install . '${{ matrix.sdk }}'
      - run: python3 -m unittest discover -s tests -p test_agents.py -v

  recurring-workflow-langgraph:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FINANCIAL_EVIDENCE_REQUIRED_FRAMEWORK: langgraph
      LANGCHAIN_TRACING_V2: 'false'
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python3 -m pip install . 'langgraph==1.2.16'
      - run: python3 -m unittest discover -s tests -p test_agent_workflow.py -v

  funding-offsite:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes restic
      - run: python3 tests/integration_funding_offsite.py
      - run: python3 tests/integration_institutional_backup.py

  funding-packet-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the restricted packet image
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker build --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" -f integrations/institutional/Dockerfile -t funding-packet-test .
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=32m -v "$PWD/tests:/tests:ro" --entrypoint python funding-packet-test -m unittest discover -s /tests -p 'test_institutional.py' -v
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=32m -v "$PWD/tests:/tests:ro" --entrypoint python funding-packet-test -m unittest discover -s /tests -p 'test_original_publishers.py' -v
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=32m -v "$PWD/tests:/tests:ro" --entrypoint python funding-packet-test -m unittest discover -s /tests -p 'test_funding_automation.py' -v
      - name: Run the usage expiry unit offline and after an interrupted start
        run: python3 scripts/verify_usage_expiry_unit.py integrations/institutional/financial-evidence-usage-expiry.service INSTITUTIONAL_IMAGE=funding-packet-test

  stdlib-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.test.js tests/*.test.cjs tests/test_google_sheets.mjs tests/context-client.test.mjs
      - run: node integrations/node-red/build_flow.cjs --check
      - run: node integrations/node-red/test_flow.cjs
      - run: python3 scripts/build_office_kit.py --check
      - run: python3 scripts/build_google_office_addon.py --check
      - run: python3 scripts/build_excel_office_addin.py --check
      - run: node --test tests/test_google_office_addon.cjs
      - run: python3 scripts/build_research_kit.py --check
      - run: python3 scripts/build_platform_hub.py --check
      - run: python3 scripts/build_product_plugins.py --check
      - run: python3 -m py_compile financial-evidence/scripts/fetch_evidence.py src/financial_evidence/*.py
      - run: python3 -m pip install .
      - run: financial-evidence route --topic money-market --format json
      - name: MCP stdio smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | financial-evidence-mcp \
            | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["result"]["tools"]) == 3'

  openbb-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        openbb-core: ["1.6.13", "2.0.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install '.[openbb,workspace]' 'openbb-core==${{ matrix.openbb-core }}'
      - run: python3 -m unittest discover -s tests -v
      - name: Prove OpenBB entry point and routes
        run: |
          python3 - <<'PY'
          from importlib.metadata import entry_points
          from financial_evidence.openbb_router import router

          matches = [
              item
              for item in entry_points(group="openbb_core_extension")
              if item.name == "financial_evidence"
          ]
          assert len(matches) == 1
          assert matches[0].load() is router
          assert sorted(route.path for route in router._api_router.routes) == [
              "/datasets",
              "/fetch",
              "/query",
              "/routes",
              "/sources",
          ]
          PY
      - run: openbb-build
      - name: Exercise generated OpenBB interface without live network data
        run: python3 scripts/verify_openbb_extension.py
      - name: Verify the downloadable research kit matches its sources
        run: python3 scripts/build_research_kit.py --check

  workspace-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the optional Workspace image
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: docker build --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" -f integrations/openbb/Dockerfile -t evidence-workspace-test .
      - name: Run the usage expiry unit offline and after an interrupted start
        run: python3 scripts/verify_usage_expiry_unit.py integrations/openbb/financial-evidence-workspace-usage-expiry.service WORKSPACE_IMAGE=evidence-workspace-test WORKSPACE_UID=65532 WORKSPACE_GID=65532
      - name: Check the read-only container through real HTTP and MCP
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          docker run --detach --name evidence-workspace-test --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:16900:6900 evidence-workspace-test \
            --host 0.0.0.0 --port 6900 --public-base-url http://127.0.0.1:16900
          trap 'docker logs evidence-workspace-test; docker rm -f evidence-workspace-test' EXIT
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = "http://127.0.0.1:16900"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=2) as response:
                      assert json.load(response)["status"] == "ok"
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("Workspace container did not become ready")
          with urllib.request.urlopen(base + "/api/v1/release", timeout=5) as response:
              identity = json.load(response)
              assert identity["source_commit"] == os.environ["EXPECTED_SOURCE"]
              assert identity["release_id"] == f"workspace-{identity['workspace_version']}+{os.environ['EXPECTED_SOURCE'][:12]}"
          with urllib.request.urlopen(base + "/widgets.json", timeout=5) as response:
              assert len(json.load(response)) == 9
          with urllib.request.urlopen(base + "/apps.json", timeout=5) as response:
              assert json.load(response)[0]["mcp_servers"][0]["url"] == base + "/mcp"
          request = urllib.request.Request(base + "/mcp", data=json.dumps({
              "jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {},
          }).encode(), headers={"Content-Type": "application/json",
                                "Accept": "application/json, text/event-stream",
                                "MCP-Protocol-Version": "2025-11-25"})
          with urllib.request.urlopen(request, timeout=5) as response:
              tools = json.load(response)["result"]["tools"]
              assert len(tools) == 12
              assert {
                  "financial_evidence_workflow",
                  "financial_evidence_funding_workflow",
                  "financial_evidence_institutions_workflow",
                  "financial_evidence_exit_workflow",
              } <= {tool["name"] for tool in tools}
          PY

  distribution-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the MCP container without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
      - name: Install pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' \
            'mcp-publisher.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - name: Validate Gemini and Claude extension contracts
        run: |
          npx --yes @google/gemini-cli@0.56.0 extensions validate .
          npx --yes @anthropic-ai/claude-code@2.1.311 plugin validate . --strict
          for plugin in plugins/*; do
            npx --yes @google/gemini-cli@0.56.0 extensions validate "$plugin"
            npx --yes @anthropic-ai/claude-code@2.1.311 plugin validate "$plugin" --strict
          done
      - name: Validate and pack the desktop MCP bundle
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . financial-evidence.mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 info financial-evidence.mcpb

  linux-office-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install independent readers and Linux Calc
        run: |
          python3 -m pip install openpyxl==3.1.5 odfpy==1.4.1 playwright==1.64.0
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libreoffice-calc
      - run: python3 scripts/build_office_kit.py --check
      - run: node --test tests/office.test.cjs
      - name: Parse the Excel queries with Microsoft's parser
        run: |
          npm install --prefix "$RUNNER_TEMP/office-parser" --no-save --ignore-scripts @microsoft/powerquery-parser@4.0.0
          node scripts/verify_office_queries.cjs "$RUNNER_TEMP/office-parser/node_modules/@microsoft/powerquery-parser"
      - run: node scripts/create_office_fixtures.cjs office-acceptance
      - name: Exercise the Excel task pane with isolated fixture-only browser requests
        run: python3 scripts/verify_excel_taskpane.py --browser /usr/bin/google-chrome --output office-acceptance
      - name: Open both formats in real LibreOffice and compare every cell
        run: python3 scripts/verify_office_files.py office-acceptance --libreoffice
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: linux-office-acceptance
          path: office-acceptance
          retention-days: 30
