name: Private runtime successor provenance

on:
  workflow_dispatch:
    inputs:
      admission_b64:
        description: Base64 bytes of the signed admission.json (artifact and receipt digests only)
        type: string
        required: true
      signed_commit_b64:
        description: Base64 bytes from git cat-file commit of the release owner's private admission commit
        type: string
        required: true

permissions:
  contents: read

jobs:
  reproduce:
    if: github.repository == 'beepboop2025/financial-evidence-skills' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify exact main source and release owner signature
        env:
          ADMISSION_B64: ${{ inputs.admission_b64 }}
          SIGNED_COMMIT_B64: ${{ inputs.signed_commit_b64 }}
        run: python3 scripts/qualify_private_runtime_release.py admission --output "$RUNNER_TEMP/admission.json"
      - name: Verify published baseline wheel provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          wheel=financial_evidence-0.1.7-py3-none-any.whl
          gh release download v0.1.7 --repo "$GITHUB_REPOSITORY" --pattern "$wheel" --dir "$RUNNER_TEMP"
          gh attestation verify "$RUNNER_TEMP/$wheel" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-container.yml" \
            --source-digest 286e86bcc011dbc8c1108fcbda8505f6c40e2283 --source-ref refs/tags/v0.1.7
      - name: Reconstruct wheel and operations archive and compare their signed digests
        run: |
          python3 scripts/qualify_private_runtime_release.py build --admission "$RUNNER_TEMP/admission.json" \
            --base-wheel "$RUNNER_TEMP/financial_evidence-0.1.7-py3-none-any.whl" --output "$RUNNER_TEMP/successor"
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          push-to-registry: false
          create-storage-record: false
          subject-path: |
            ${{ runner.temp }}/successor/wheel/financial_evidence-0.1.7+successor.1-py3-none-any.whl
            ${{ runner.temp }}/successor/ops/financial-evidence-runtime-ops-1.0.3+successor.1.tar
