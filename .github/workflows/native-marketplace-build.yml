name: Native marketplace packages

on:
  pull_request:
    paths: ['integrations/n8n-node/**', 'integrations/dify/**', '.github/workflows/native-marketplace-*.yml']
  push:
    branches: [main]
    paths: ['integrations/n8n-node/**', 'integrations/dify/**', '.github/workflows/native-marketplace-*.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n8n-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: integrations/n8n-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm run build && npm run lint && npm test
      - name: Install the pinned native host
        run: npm install --prefix "$RUNNER_TEMP/n8n-runtime" n8n@2.42.6 --legacy-peer-deps --no-audit --no-fund
      - name: Execute the packaged node in a fresh native host
        run: python3 scripts/native_smoke.py --n8n-bin "$RUNNER_TEMP/n8n-runtime/node_modules/.bin/n8n" --evidence-dir "$RUNNER_TEMP/n8n-evidence"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: n8n-native-${{ github.sha }}
          # Deliberately omit the n8n profile/database and its generated encryption key.
          path: |
            ${{ runner.temp }}/n8n-evidence/*.json
            ${{ runner.temp }}/n8n-evidence/*.stdout
            ${{ runner.temp }}/n8n-evidence/*.stderr
            ${{ runner.temp }}/n8n-evidence/*.tgz
          if-no-files-found: error

  dify-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/dify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Register the actual manifest and provider
        run: python -c 'from dify_plugin.core.plugin_registration import PluginRegistration; from dify_plugin import DifyPluginEnv; PluginRegistration(DifyPluginEnv())'
      - name: Verify and run the official package CLI
        run: |
          curl --fail --location --silent --show-error https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.11/dify-plugin-linux-amd64 -o "$RUNNER_TEMP/dify"
          printf '%s  %s\n' e68208928fbd8e7bc2c4cf0943f5091f8fbd0a25119ab4f36d6071b94a69a6fc "$RUNNER_TEMP/dify" | sha256sum --check
          chmod +x "$RUNNER_TEMP/dify"
          "$RUNNER_TEMP/dify" plugin package . --output_path "$RUNNER_TEMP/financial_evidence.difypkg"
          python scripts/verify_package.py "$RUNNER_TEMP/financial_evidence.difypkg" > "$RUNNER_TEMP/dify-package-receipt.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: dify-package-${{ github.sha }}
          path: |
            ${{ runner.temp }}/financial_evidence.difypkg
            ${{ runner.temp }}/dify-package-receipt.json
          if-no-files-found: error
