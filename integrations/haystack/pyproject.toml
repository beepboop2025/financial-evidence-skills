[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "financial-evidence-haystack"
version = "0.1.0"
description = "Read-only cited financial research in Haystack pipelines and tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liquidity Lab" }]
dependencies = [
  "haystack-ai>=3.3,<4",
  "financial-evidence @ git+https://github.com/beepboop2025/financial-evidence-skills.git@c1fbdc1f6f6783c6013759ee68fb9bae7e3729f8",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Homepage = "https://github.com/beepboop2025/financial-evidence-skills/tree/main/integrations/haystack"
Documentation = "https://github.com/beepboop2025/financial-evidence-skills/blob/main/docs/haystack-integration.md"
Issues = "https://github.com/beepboop2025/financial-evidence-skills/issues"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/financial_evidence_haystack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
