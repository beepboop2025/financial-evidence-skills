name: Activepieces native acceptance

on:
  workflow_dispatch:
  pull_request:
    paths: ['integrations/activepieces/**', '.github/workflows/activepieces-native-acceptance.yml']

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/activepieces
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build && npm test
      - name: Install the packed piece and execute both actions in the native host
        run: python3 scripts/native_smoke.py --evidence-dir "$RUNNER_TEMP/activepieces-evidence"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: activepieces-native-${{ github.sha }}
          # Never retain the host database, temporary account credentials or tokens.
          path: |
            ${{ runner.temp }}/activepieces-evidence/receipt.json
            ${{ runner.temp }}/activepieces-evidence/*.tgz
            ${{ runner.temp }}/activepieces-evidence/runtime-diagnostic.txt
          if-no-files-found: error
