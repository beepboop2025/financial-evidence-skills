  <g id="text_15">
   <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start" x="50.544" y="75.437813" transform="rotate(-0 50.544 75.437813)">8 October 2026 observations · IORB reference: 3.90%</text>
  </g>
  <g id="text_16">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(50.544 102.523712)">The SOFR 99th percentile was 5 bp above IORB.</text>
   <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(50.544 119.023712)">A same-date rate comparison; no institution-stress score is inferred.</text>
  </g>
  <g id="text_17">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(50.544 377.072437)">Calculation: (rate in percent − IORB in percent) × 100. One basis point = 0.01 percentage point.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(50.544 390.122437)">SOFR's 99th percentile describes its transaction-rate distribution; it is not another policy rate.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(50.544 403.172438)">Sources: New York Fed Markets API; Federal Reserve Board PRATES. Analysis: Seiche / LiquiLens.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(50.544 416.222437)">Frozen review: 8 October; packet captured 11 October 2026. Newer dates exist for some other inputs.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(50.544 458.21475)">Copyright 2026 Federal Reserve Bank of New York. Content from the New York Fed subject to the Terms of Use at newyorkfed.org. SOFR, EFFR and</text>
   <text style="font-size: 7.2px; font-family: 'DejaVu Sans'" transform="translate(50.544 468.65475)">operation results are subject to those Terms of Use. The New York Fed is not responsible for publication of these data by Liquidity Lab, does not</text>
