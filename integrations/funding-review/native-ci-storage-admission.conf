[Service]
Environment=FUNDING_OFFSITE_STORAGE_POLICY=/etc/financial-evidence/funding-offsite-storage-policy.json
SuccessExitStatus=75
ExecStopPost=/bin/sh -c 'if [ "$$EXIT_CODE" = exited ] && [ "$$EXIT_STATUS" = 75 ]; then exec /usr/bin/systemctl --no-block restart financial-evidence-funding-offsite-deferred.timer; fi'
