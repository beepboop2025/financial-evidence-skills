name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  homebrew-candidate-consumer:
    name: Independent Homebrew candidate acceptance
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
      TAP_SOURCE: "d10d67b30e6d93e2e0b65e8798ef6b6ebf33266c"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: beepboop2025/homebrew-tap
          ref: d10d67b30e6d93e2e0b65e8798ef6b6ebf33266c
          path: tap-candidate
          persist-credentials: false
      - name: Register only the exact public candidate tap
        run: |
          test "$(git -C tap-candidate rev-parse HEAD)" = "$TAP_SOURCE"
          brew tap beepboop2025/tap "$GITHUB_WORKSPACE/tap-candidate"
          test "$(git -C "$(brew --repo beepboop2025/tap)" rev-parse HEAD)" = "$TAP_SOURCE"
      - run: brew audit --strict --online beepboop2025/tap/financial-evidence
      - run: brew style beepboop2025/tap/financial-evidence
      - run: brew install beepboop2025/tap/financial-evidence
      - run: brew test beepboop2025/tap/financial-evidence
      - name: Verify installed MCP and retain the separate candidate identity
        run: |
          python3 scripts/verify_published_mcp.py --receipt homebrew-mcp-receipt.json -- \
            "$(brew --prefix financial-evidence)/bin/financial-evidence-mcp"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          from datetime import datetime, timezone
          tap = subprocess.check_output(["brew", "--repo", "beepboop2025/tap"], text=True).strip()
          source = subprocess.check_output(["git", "-C", tap, "rev-parse", "HEAD"], text=True).strip()
          assert source == os.environ["TAP_SOURCE"]
          formula = pathlib.Path(tap) / "Formula/financial-evidence.rb"
          receipt = {"schema": "financial-evidence.homebrew-candidate-acceptance.v1",
                     "observed_at": datetime.now(timezone.utc).isoformat(),
                     "source_commit": source, "formula_sha256": hashlib.sha256(formula.read_bytes()).hexdigest(),
                     "checks": ["strict_online_audit", "style", "actual_install", "formula_test", "published_mcp_contract"],
                     "status": "PASS", "scope": "Independent consumer acceptance, not native tap CI or public tap publication"}
          pathlib.Path("homebrew-source-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: homebrew-candidate-consumer
          path: |
            homebrew-mcp-receipt.json
            homebrew-source-receipt.json
          retention-days: 30

  published-mcp-consumer:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull the immutable public release
        run: docker pull --platform '${{ matrix.platform }}' ghcr.io/beepboop2025/financial-evidence-skills@sha256:5d4cff428c8ad95d57217c2e2a9dd55be4ecb570a072e57c949ddaef567365f1
      - name: Exercise the published stdio contract without network access
        env:
          TESTED_PLATFORM: ${{ matrix.platform }}
        run: |
          python3 scripts/verify_published_mcp.py --receipt published-mcp-receipt.json -- \
            docker run --rm --interactive --platform "$TESTED_PLATFORM" --pull never --read-only --network none \
            --cap-drop ALL --security-opt no-new-privileges --pids-limit 64 \
            --memory 128m --cpus 1 \
            ghcr.io/beepboop2025/financial-evidence-skills@sha256:5d4cff428c8ad95d57217c2e2a9dd55be4ecb570a072e57c949ddaef567365f1
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          image = "ghcr.io/beepboop2025/financial-evidence-skills@sha256:5d4cff428c8ad95d57217c2e2a9dd55be4ecb570a072e57c949ddaef567365f1"
          details = json.loads(subprocess.check_output(["docker", "image", "inspect", image]))[0]
          platform = details["Os"] + "/" + details["Architecture"]
          assert platform == os.environ["TESTED_PLATFORM"]
          assert details["Config"]["Labels"]["org.opencontainers.image.revision"] == "5435c9c8d8acba9a2d3e170469976b6cac2fb4b4"
          assert details["Config"]["User"] == "65532:65532"
          path = pathlib.Path("published-mcp-receipt.json")
          receipt = json.loads(path.read_text())
          receipt.update(tested_platform=platform, image=image, image_id=details["Id"],
                         source_commit=details["Config"]["Labels"]["org.opencontainers.image.revision"])
          path.write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Retain the published artifact receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: published-mcp-consumer-${{ matrix.architecture }}
          path: published-mcp-receipt.json
          retention-days: 30

  native-agent-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        sdk: ["langchain-core==1.6.6", "crewai==1.6.1", "openai-agents==0.22.3", "pydantic-ai-slim==2.52.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install . '${{ matrix.sdk }}'
      - run: python3 -m unittest discover -s tests -p test_agents.py -v

  funding-offsite:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install --yes restic
      - run: python3 tests/integration_funding_offsite.py
      - run: python3 tests/integration_institutional_backup.py

  funding-packet-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the restricted packet image
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker build --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" -f integrations/institutional/Dockerfile -t funding-packet-test .
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=32m -v "$PWD/tests:/tests:ro" --entrypoint python funding-packet-test -m unittest discover -s /tests -p 'test_institutional.py' -v
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=32m -v "$PWD/tests:/tests:ro" --entrypoint python funding-packet-test -m unittest discover -s /tests -p 'test_original_publishers.py' -v
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,size=32m -v "$PWD/tests:/tests:ro" --entrypoint python funding-packet-test -m unittest discover -s /tests -p 'test_funding_automation.py' -v

  stdlib-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.test.js tests/*.test.cjs
      - run: python3 -m py_compile financial-evidence/scripts/fetch_evidence.py src/financial_evidence/*.py
      - run: python3 -m pip install .
      - run: financial-evidence route --topic money-market --format json
      - name: MCP stdio smoke test
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | financial-evidence-mcp \
            | python3 -c 'import json,sys; assert len(json.load(sys.stdin)["result"]["tools"]) == 3'

  openbb-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m pip install '.[openbb,workspace]'
      - run: python3 -m unittest discover -s tests -v
      - name: Prove OpenBB entry point and routes
        run: |
          python3 - <<'PY'
          from importlib.metadata import entry_points
          from financial_evidence.openbb_router import router

          matches = [
              item
              for item in entry_points(group="openbb_core_extension")
              if item.name == "financial_evidence"
          ]
          assert len(matches) == 1
          assert matches[0].load() is router
          assert sorted(route.path for route in router._api_router.routes) == [
              "/datasets",
              "/fetch",
              "/query",
              "/routes",
              "/sources",
          ]
          PY
      - run: openbb-build
      - name: Exercise generated OpenBB interface without live network data
        run: |
          python3 - <<'PY'
          from openbb import obb
          result = obb.financial_evidence.datasets()
          assert len(result.to_df()) == 7
          assert callable(obb.financial_evidence.query)
          assert callable(obb.financial_evidence.sources)
          PY

  workspace-container:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the optional Workspace image
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: docker build --build-arg SOURCE_COMMIT="$SOURCE_COMMIT" -f integrations/openbb/Dockerfile -t evidence-workspace-test .
      - name: Check the read-only container through real HTTP and MCP
        env:
          EXPECTED_SOURCE: ${{ github.sha }}
        run: |
          docker run --detach --name evidence-workspace-test --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 127.0.0.1:16900:6900 evidence-workspace-test \
            --host 0.0.0.0 --port 6900 --public-base-url http://127.0.0.1:16900
          trap 'docker logs evidence-workspace-test; docker rm -f evidence-workspace-test' EXIT
          python3 - <<'PY'
          import json, os, time, urllib.request
          base = "http://127.0.0.1:16900"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(base + "/healthz", timeout=2) as response:
                      assert json.load(response)["status"] == "ok"
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError("Workspace container did not become ready")
          with urllib.request.urlopen(base + "/api/v1/release", timeout=5) as response:
              identity = json.load(response)
              assert identity["source_commit"] == os.environ["EXPECTED_SOURCE"]
              assert identity["release_id"] == f"workspace-{identity['workspace_version']}+{os.environ['EXPECTED_SOURCE'][:12]}"
          with urllib.request.urlopen(base + "/widgets.json", timeout=5) as response:
              assert len(json.load(response)) == 9
          with urllib.request.urlopen(base + "/apps.json", timeout=5) as response:
              assert json.load(response)[0]["mcp_servers"][0]["url"] == base + "/mcp"
          request = urllib.request.Request(base + "/mcp", data=json.dumps({
              "jsonrpc": "2.0", "id": 1, "method": "tools/list", "params": {},
          }).encode(), headers={"Content-Type": "application/json",
                                "Accept": "application/json, text/event-stream",
                                "MCP-Protocol-Version": "2025-11-25"})
          with urllib.request.urlopen(request, timeout=5) as response:
              assert len(json.load(response)["result"]["tools"]) == 8
          PY

  distribution-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the MCP container without publishing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
      - name: Install pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' \
            'mcp-publisher.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - name: Validate Gemini and Claude extension contracts
        run: |
          npx --yes @google/gemini-cli@0.56.0 extensions validate .
          npx --yes @anthropic-ai/claude-code@2.1.241 plugin validate . --strict
      - name: Validate and pack the desktop MCP bundle
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . financial-evidence.mcpb
          npx --yes @anthropic-ai/mcpb@2.1.2 info financial-evidence.mcpb
