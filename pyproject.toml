[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "financial-evidence"
version = "0.1.5"
description = "Read-only terminal and MCP router for public financial evidence"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Liquidity Lab" }]
keywords = [
  "capital-markets",
  "china-economy",
  "financial-data",
  "liquidity",
  "mcp",
  "money-markets",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
openbb = ["openbb-core>=1.6.13,<2"]

[project.urls]
Homepage = "https://github.com/beepboop2025/financial-evidence-skills"
Issues = "https://github.com/beepboop2025/financial-evidence-skills/issues"
Source = "https://github.com/beepboop2025/financial-evidence-skills"

[project.scripts]
financial-evidence = "financial_evidence.cli:main"
financial-evidence-mcp = "financial_evidence.mcp:main"

[project.entry-points.openbb_core_extension]
financial_evidence = "financial_evidence.openbb_router:router"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_evidence"]
