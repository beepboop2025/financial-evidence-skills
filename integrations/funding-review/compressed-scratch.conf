[Unit]
RequiresMountsFor=/mnt/financial-evidence-funding-scratch
BindsTo=mnt-financial\x2devidence\x2dfunding\x2dscratch.mount

[Service]
Environment=FUNDING_OFFSITE_STORAGE_POLICY=/etc/financial-evidence/funding-offsite-storage-policy-compressed.json
ReadWritePaths=/mnt/financial-evidence-funding-scratch
# Let the compressed filesystem allocate extents as Restic writes each file.
SystemCallFilter=~fallocate:EOPNOTSUPP
