name: n8n uncut review demo

on:
  pull_request:
    paths: ['integrations/n8n-node/scripts/review_demo.*', '.github/workflows/n8n-review-demo.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8n-review-demo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  genuine-ui-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.14.0'
      - name: Test proof and private-state boundaries
        run: node --test integrations/n8n-node/scripts/review_demo.test.mjs
      - name: Install pinned native host and browser on the ephemeral Linux runner
        run: |
          npm install --prefix "$RUNNER_TEMP/demo-runtime" n8n@2.42.6 playwright@1.64.0 flatted@3.4.1 --legacy-peer-deps --no-audit --no-fund
          "$RUNNER_TEMP/demo-runtime/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg zstd
      - name: Verify and extract the pinned Ollama CPU-capable distribution
        run: |
          mkdir -p "$RUNNER_TEMP/demo-ollama"
          curl --fail --location --silent --show-error https://github.com/ollama/ollama/releases/download/v0.40.2/ollama-linux-amd64.tar.zst -o "$RUNNER_TEMP/ollama.tar.zst"
          printf '%s  %s\n' 726bee78706c281b0eeef00746efe51a044d71c592c3f0b195820707f31fdf04 "$RUNNER_TEMP/ollama.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/ollama.tar.zst" -C "$RUNNER_TEMP/demo-ollama"
      - name: Record actual UI installation, three actions and real local-model tool call
        run: node integrations/n8n-node/scripts/review_demo.mjs "$RUNNER_TEMP/demo-runtime" "$RUNNER_TEMP/demo-ollama/bin/ollama" "$RUNNER_TEMP/n8n-review-demo"
      - name: Retain only allowlisted review output
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: n8n-review-demo-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/n8n-review-demo/review/receipt.json
            ${{ runner.temp }}/n8n-review-demo/review/review-demo.mp4
            ${{ runner.temp }}/n8n-review-demo/review/original-uncut.webm
          if-no-files-found: error
          retention-days: 7
          # Never upload private/ (owner, cookies, DB, service logs or failed video).
