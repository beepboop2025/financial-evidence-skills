name: Stage native n8n package

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact reviewed main commit (40 hexadecimal characters)
        type: string
        required: true
      expected_version:
        description: Exact package version to stage or verify
        type: string
        required: true
      expected_archive_sha256:
        description: SHA-256 of the reviewed existing download (64 hexadecimal characters)
        type: string
        required: true
      mode:
        description: Staging requires a separate human npm approval before publication
        type: choice
        options: [dry-run, stage, verify-published]
        default: dry-run

permissions:
  contents: read

concurrency:
  group: native-marketplace-npm-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: integrations/n8n-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Verify reviewed source, version and archive
        id: candidate
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.expected_archive_sha256 }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const {createHash} = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          const {EXPECTED_SHA: sha, EXPECTED_VERSION: version, EXPECTED_ARCHIVE_SHA256: hash} = process.env;
          if (!/^[a-f0-9]{40}$/.test(sha) || sha !== execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim()) throw Error('Reviewed source mismatch');
          const pkg = require('./package.json');
          if (pkg.name !== 'n8n-nodes-financial-evidence' || pkg.version !== version || !/^\d+\.\d+\.\d+$/.test(version)) throw Error('Package identity mismatch');
          const archive = `../../docs/platforms/downloads/${pkg.name}-${version}.tgz`;
          if (!/^[a-f0-9]{64}$/.test(hash) || createHash('sha256').update(fs.readFileSync(archive)).digest('hex') !== hash) throw Error('Reviewed archive mismatch');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `archive=${archive}\nfilename=${pkg.name}-${version}.tgz\n`);
          JS
      - run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - run: npm run build && npm run lint && npm test
      - run: npm install --prefix "$RUNNER_TEMP/n8n-runtime" n8n@2.42.6 --legacy-peer-deps --no-audit --no-fund
      - name: Execute the existing archive, checking its runtime against the fresh build
        env:
          ARCHIVE: ${{ steps.candidate.outputs.archive }}
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.expected_archive_sha256 }}
        run: |
          python3 scripts/native_smoke.py --n8n-bin "$RUNNER_TEMP/n8n-runtime/node_modules/.bin/n8n" \
            --evidence-dir "$RUNNER_TEMP/n8n-evidence" --archive "$ARCHIVE" \
            --expected-sha256 "$EXPECTED_ARCHIVE_SHA256"
      - name: Dry run the exact tested tarball
        run: npm stage publish "$RUNNER_TEMP"/n8n-evidence/*.tgz --access public --tag latest --dry-run --ignore-scripts
      - name: Verify public bytes and provenance metadata
        if: inputs.mode == 'verify-published'
        run: node scripts/verify_published.mjs "$RUNNER_TEMP"/n8n-evidence/*.tgz "$RUNNER_TEMP/n8n-evidence/npm-readback.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: n8n-candidate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/n8n-evidence/*.json
            ${{ runner.temp }}/n8n-evidence/*.stdout
            ${{ runner.temp }}/n8n-evidence/*.stderr
            ${{ runner.temp }}/n8n-evidence/*.tgz
          if-no-files-found: error

  stage:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.mode == 'stage'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: n8n-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/n8n-evidence
      - name: Check the downloaded bytes and successful native receipt
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
          EXPECTED_ARCHIVE_SHA256: ${{ inputs.expected_archive_sha256 }}
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const {createHash} = require('node:crypto');
          const {execFileSync} = require('node:child_process');
          const {EXPECTED_SHA: sha, EXPECTED_VERSION: version, EXPECTED_ARCHIVE_SHA256: hash} = process.env;
          if (execFileSync('git', ['rev-parse', 'HEAD'], {encoding: 'utf8'}).trim() !== sha || !/^\d+\.\d+\.\d+$/.test(version)) throw Error('Reviewed source/version mismatch');
          const folder = `${process.env.RUNNER_TEMP}/n8n-evidence`;
          const archive = `${folder}/n8n-nodes-financial-evidence-${version}.tgz`;
          const receipt = JSON.parse(fs.readFileSync(`${folder}/receipt.json`));
          if (receipt.status !== 'passed' || receipt.sha256 !== hash || createHash('sha256').update(fs.readFileSync(archive)).digest('hex') !== hash) throw Error('Native-tested archive mismatch');
          fs.appendFileSync(process.env.GITHUB_ENV, `N8N_ARCHIVE=${archive}\n`);
          JS
      - name: Stage with provenance using only the configured OIDC publisher
        # No NPM_TOKEN, local session token, direct publish, or approval fallback.
        run: npm stage publish "$N8N_ARCHIVE" --access public --tag latest --provenance --ignore-scripts --json > "$RUNNER_TEMP/npm-stage-result.json"
      - name: Explain the pending human approval
        run: |
          printf '%s\n' 'Candidate staged with provenance; this workflow does not publish the candidate version. Review the npm stage and approve separately with 2FA, then run verify-published.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: n8n-stage-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-stage-result.json
          if-no-files-found: error
