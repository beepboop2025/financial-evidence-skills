name: Financial framework packages

on:
  push:
    branches: [main]
    paths: ["integrations/haystack/**", "integrations/langchain/**", ".github/workflows/financial-framework-packages.yml"]
  pull_request:
    paths: ["integrations/haystack/**", "integrations/langchain/**", ".github/workflows/financial-framework-packages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  haystack:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install './integrations/haystack[test]' 'haystack-ai==3.3.0' build twine
      - run: python -m pytest integrations/haystack/tests -q
      - run: python -m build integrations/haystack
      - run: python -m twine check integrations/haystack/dist/*

  langchain:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        core: ["1.6.6", "1.6.9"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install './integrations/langchain[test]' 'langchain-core==${{ matrix.core }}' build twine
      - run: python -m pytest integrations/langchain/tests/unit_tests --disable-socket --allow-unix-socket -q
      - run: python -m build integrations/langchain
      - run: python -m twine check integrations/langchain/dist/*
