name: release-container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: financial-evidence-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Prove the tag and every release manifest agree
        run: |
          signer_file="ops/release/financial-evidence.allowed_signers"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-tag --raw "$GITHUB_REF_NAME"
          release_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile="$signer_file" \
            verify-commit --raw "$release_commit"
          git fetch origin main --no-tags
          test "$release_commit" = "$(git rev-parse origin/main)"
          version="${GITHUB_REF_NAME#v}"
          test "$(jq --raw-output .version manifest.json)" = "$version"
          test "$(jq --raw-output .version server.json)" = "$version"
          test "$(jq --raw-output '.packages[0].identifier | split(":")[-1]' server.json)" = "$version"
          test "$(jq --raw-output .version gemini-extension.json)" = "$version"
          test "$(jq --raw-output .version .claude-plugin/plugin.json)" = "$version"
          test "$(jq --raw-output .version .codex-plugin/plugin.json)" = "$version"
          test "$(jq --raw-output '.plugins[0].source.ref' .agents/plugins/marketplace.json)" = "$GITHUB_REF_NAME"
          test "$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$version"
          test "$(PYTHONPATH=src python3 -c 'import financial_evidence; print(financial_evidence.__version__)')" = "$version"
      - name: Re-run release contract suites
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/*.test.js tests/*.test.cjs
          python3 -m py_compile financial-evidence/scripts/fetch_evidence.py src/financial_evidence/*.py scripts/verify_remote_mcp.py
      - name: Require the pinned live Worker and unchanged source on site main
        run: |
          expected_worker_tag="$(jq --raw-output .worker_source_commit ops/release/remote-mcp.json)"
          printf '%s\n' "$expected_worker_tag" | grep -Eq '^[0-9a-f]{40}$'
          git clone --filter=blob:none --no-checkout \
            https://github.com/beepboop2025/liquilens-site.git "$RUNNER_TEMP/remote-site"
          git -C "$RUNNER_TEMP/remote-site" merge-base --is-ancestor "$expected_worker_tag" origin/main
          mapfile -t worker_paths < <(jq --raw-output '.source_paths[]' ops/release/remote-mcp.json)
          git -C "$RUNNER_TEMP/remote-site" diff --exit-code "$expected_worker_tag" origin/main -- "${worker_paths[@]}"
          python3 scripts/verify_remote_mcp.py \
            --expected-worker-tag "$expected_worker_tag"
      - name: Install pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' \
            'mcp-publisher.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
      - run: ./mcp-publisher validate server.json

  python-build:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Build the Python distributions once
        run: |
          python3 -m pip install 'build==1.3.0' 'twine==7.0.0'
          python3 -m build
          python3 -m twine check --strict dist/*
          python3 scripts/verify_pypi_metadata.py dist/*.whl
      - name: Exercise the installed SDK and registry entrypoint
        run: |
          python3 -m venv /tmp/financial-evidence-consumer
          /tmp/financial-evidence-consumer/bin/python -m pip install "$(find dist -name '*.whl')[workspace]"
          /tmp/financial-evidence-consumer/bin/python -m pip check
          PYTHONPATH='' /tmp/financial-evidence-consumer/bin/python - <<'PY'
          from financial_evidence.trading import ProductClient
          from financial_evidence.trading.context import ContextClient
          from financial_evidence.trading.source_contract import load_catalog
          assert ProductClient and ContextClient and load_catalog()["sources"]
          PY
          python3 scripts/verify_published_mcp.py --contract integrations/financial-evidence-mcp-current.json --receipt python-consumer-receipt.json -- \
            /tmp/financial-evidence-consumer/bin/financial-evidence mcp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  pypi:
    needs: python-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/financial-evidence/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Publish the tested distributions with GitHub OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  ghcr:
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5.8.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

  mcp-registry:
    needs: [ghcr, pypi]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher.tar.gz \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          printf '%s  %s\n' \
            'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' \
            'mcp-publisher.tar.gz' \
            | sha256sum --check --strict
          tar --extract --gzip --file mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --version
      - name: Validate metadata
        run: ./mcp-publisher validate server.json
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish to the official MCP Registry
        run: ./mcp-publisher publish server.json

  release-assets:
    needs: [ghcr, mcp-registry]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - name: Validate release version and build artifacts
        run: |
          version="${GITHUB_REF_NAME#v}"
          npx --yes @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack . "financial-evidence-${version}.mcpb"
      - name: Generate the release CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: cyclonedx-json
          output-file: financial-evidence-${{ github.ref_name }}.cdx.json
          artifact-name: financial-evidence-${{ github.ref_name }}.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Calculate release subject digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            (cd dist && sha256sum -- *)
            sha256sum "financial-evidence-${version}.mcpb"
            sha256sum "financial-evidence-${GITHUB_REF_NAME}.cdx.json"
          } > SHA256SUMS
      - name: Attest the wheel, source archive, MCP bundle, and SBOM
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: SHA256SUMS
      - name: Attach artifacts to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            dist/* \
            "financial-evidence-${GITHUB_REF_NAME#v}.mcpb" \
            "financial-evidence-${GITHUB_REF_NAME}.cdx.json" \
            SHA256SUMS \
            --clobber
