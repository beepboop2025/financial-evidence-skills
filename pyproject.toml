[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "financial-evidence"
version = "0.1.13"
description = "Financial research for Python and AI agents: funding, bank disclosures, market liquidity and source provenance"
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Liquidity Lab" }]
keywords = [
  "seiche",
  "liquilens",
  "undertow",
  "palimpsest",
  "ai-agents",
  "trading-research",
  "bank-disclosures",
  "model-context-protocol",
  "source-provenance",
  "capital-markets",
  "china-economy",
  "financial-data",
  "forex",
  "gift-city",
  "gold",
  "liquidity",
  "mcp",
  "money-markets",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.optional-dependencies]
openbb = ["openbb-core>=1.6.13,<3", "pandas>=1.5.3,<4"]
workspace = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp>=1.30,<2", "PyJWT[crypto]>=2.15.1,<3"]

[project.urls]
Homepage = "https://beepboop2025.github.io/financial-evidence-skills/distribution/ai-trading-tools.html"
Documentation = "https://beepboop2025.github.io/financial-evidence-skills/agents/FIRST_REVIEW.md"
"Product connections" = "https://beepboop2025.github.io/financial-evidence-skills/connect/"
"Agent workflows" = "https://beepboop2025.github.io/financial-evidence-skills/start/agent-workflows.md"
"MCP connection" = "https://agents.seiche.info/products/financial-evidence/mcp"
"API and source-status contract" = "https://agents.seiche.info/v1/context/contract"
Issues = "https://github.com/beepboop2025/financial-evidence-skills/issues"
Source = "https://github.com/beepboop2025/financial-evidence-skills"

[project.scripts]
financial-evidence = "financial_evidence.cli:main"
financial-evidence-mcp = "financial_evidence.mcp:main"
financial-evidence-api = "financial_evidence.workspace:main"
financial-evidence-workspace-mcp = "financial_evidence.workspace_mcp:main"
financial-evidence-agent-mcp = "financial_evidence.workspace_mcp:main"
financial-evidence-runtime = "financial_evidence.runtime.cli:main"
financial-evidence-runtime-mcp = "financial_evidence.runtime.mcp:main"
financial-evidence-learning = "financial_evidence.learning.cli:main"
financial-evidence-trading = "financial_evidence.trading.cli:main"
seiche-network-client-mcp = "financial_evidence.trading.network:main"
financial-evidence-product-mcp = "financial_evidence.trading.product_mcp:main"

[project.entry-points.openbb_core_extension]
financial_evidence = "financial_evidence.openbb_router:router"

[tool.hatch.build.targets.wheel]
packages = ["src/financial_evidence"]
